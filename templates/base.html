{% load static %}

<!doctype html>
<html lang="en">
<head>

    <!-- =====================================================
         BASIC META
         ====================================================== -->

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <!-- SEO Description -->
    <meta
        name="description"
        content="{% block meta_description %}Your website description{% endblock meta_description %}"
    >

    <!-- Browser Theme Color -->
    <meta name="theme-color" content="#FB8900">


    <!-- =====================================================
         WEBSITE ICON
         ====================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="{% static 'images/logo-Icon.png' %}"
    >

    <link
        rel="apple-touch-icon"
        href="{% static 'images/logo-Icon.png' %}"
    >


    <!-- =====================================================
         PAGE TITLE
         ====================================================== -->

    <title>
        {% block title %}My Website{% endblock title %}
    </title>


    <!-- =====================================================
         BOOTSTRAP 5.3.8
         ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >


    <!-- =====================================================
         GOOGLE FONT
         ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME FREE 7.3.1
         ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >


    <!-- =====================================================
         CUSTOM CSS
         ====================================================== -->

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >


    <!-- Page-specific CSS -->
    {% block extra_css %}{% endblock extra_css %}

</head>


<body>


    <!-- =====================================================
         NAVBAR
         ====================================================== -->

    {% include 'includes/navbar.html' %}


    <!-- =====================================================
         MAIN CONTENT
         ====================================================== -->

    <main id="main-content">

        {% block content %}
        {% endblock content %}

    </main>


    <!-- =====================================================
         FOOTER
         ====================================================== -->

    {% include 'includes/footer.html' %}


    <!-- =====================================================
         BOOTSTRAP JAVASCRIPT
         ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>


    <!-- =====================================================
         CUSTOM JAVASCRIPT
         ====================================================== -->

    <script
        src="{% static 'js/main.js' %}"
        defer>
    </script>


    <!-- Page-specific JavaScript -->
    {% block extra_js %}{% endblock extra_js %}


</body>
</html>
